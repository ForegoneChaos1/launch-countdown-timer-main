<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="stylesheet" href="style.css">
  <title>Frontend Mentor | Launch countdown timer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inconsolata:wght@200..900&family=Red+Hat+Text:ital,wght@0,300..700;1,300..700&display=swap"
    rel="stylesheet">
</head>

<body>
  <figure class="hills"><img src="./images/pattern-hills.svg" alt=""></figure>

  <h1>WE'RE LAUNCHING SOON</h1>

  <section class="timer">
    <div class="countdown-container">
      <div class="flip-card">
        <div class="number days">08</div>
        <div class="card-split"></div>
      </div>
      <div class="label">DAYS</div>
    </div>

    <div class="countdown-container">
      <div class="flip-card">
        <div class="number hours">23</div>
        <div class="card-split"></div>
      </div>
      <div class="label">HOURS</div>
    </div>

    <div class="countdown-container">
      <div class="flip-card">
        <div class="number minutes">55</div>
        <div class="card-split"></div>
      </div>
      <div class="label">MINUTES</div>
    </div>

    <div class="countdown-container">
      <div class="flip-card">
        <div class="number seconds">41</div>
        <div class="card-split"></div>
      </div>
      <div class="label">SECONDS</div>
    </div>
  </section>

  <section class="socials">
    <figure>
      <img src="./images/icon-facebook.svg" alt="">
    </figure>
    <figure>
      <img src="./images/icon-pinterest.svg">
    </figure>
    <figure>
      <img src="./images/icon-instagram.svg">
    </figure>
  </section>
  <!-- <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
    Coded by <a href="#">Your Name Here</a>.
  </footer> -->
  <script src="./index.js"></script>
</body>

</html>
